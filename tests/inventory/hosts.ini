# Local development / testing inventory.
#
# This repository is the `bergantz_galaxy.home` collection and ships NO
# environment inventory: real host data (per-environment group_vars, per-host
# host_vars) lives in the downstream consumer repo that installs this collection.
#
# This single loopback host exists only so the Makefile targets
# (check / run / ping / syntax-check) and the pytest suite run locally. Target
# real hosts by passing your own inventory or an ad-hoc `-i 'host,'` argument.
[local]
localhost ansible_connection=local
