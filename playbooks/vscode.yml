---
# Installs VS Code and its extensions. Targets whatever inventory/host you run
# it against, e.g.:
#   make LIMIT=local PLAYBOOK=playbooks/vscode.yml run
- name: Install and configure VS Code
  hosts: all
  gather_facts: false
  roles:
    - role: 1password_ssh_user_pass
    - role: ssh
    - role: vscode
