---
name: lint

"on":
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: yamllint + ansible-lint + syntax
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Bootstrap dependencies
        run: make bootstrap

      - name: Run linters and syntax check
        run: make test
