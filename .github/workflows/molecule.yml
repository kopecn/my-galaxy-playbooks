---
name: molecule

"on":
  push:
    branches: [main]
  pull_request:

jobs:
  molecule:
    name: molecule test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One entry per molecule make target; add a target here as roles grow.
        target:
          - test-molecule-example
          - test-molecule-vscode
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Bootstrap dependencies
        run: make bootstrap

      - name: Run molecule
        run: make ${{ matrix.target }}
        env:
          ANSIBLE_FORCE_COLOR: "1"
          PY_COLORS: "1"
