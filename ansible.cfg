[defaults]
# Roles installed from Galaxy land in galaxy_roles/; local roles live in roles/.
roles_path = roles:galaxy_roles
collections_path = galaxy_roles
host_key_checking = False
retry_files_enabled = False
callback_result_format = yaml
interpreter_python = auto_silent
forks = 20
nocows = True
remote_tmp = ~/.ansible/tmp
log_path = ~/.ansible/ansible.log
display_failed_stderr = yes
force_handlers = yes
gathering = smart
timeout = 30
show_task_path_on_failure = yes

[inventory]
enable_plugins = host_list, script, auto, yaml, ini, toml

[diff]
always = True

[privilege_escalation]
become = False
become_method = sudo
become_user = root
become_ask_pass = False

[connection]
# Required by ansible_private_key (ansible-core >= 2.19). Ansible creates and
# destroys this agent for each run; private keys remain in memory.
ssh_agent = auto

[ssh_connection]
pipelining = True
control_path = %(directory)s/%%h-%%p-%%r
retries = 3
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=30 -o ServerAliveCountMax=10

[colors]
ok = bright green
error = red
changed = yellow
