---
- name: Validate the requested Claude operations
  ansible.builtin.assert:
    that:
      - claudeOperations is sequence
      - claudeOperations is not string
      - claudeOperations | length > 0
      - claudeOperations | difference(claudeSupportedOperations) | length == 0
    fail_msg: >-
      Declare claudeOperations as a non-empty list containing only
      {{ claudeSupportedOperations }}.
    quiet: true

- name: Gather the target platform facts after resolving the SSH route
  ansible.builtin.setup:
    gather_subset:
      - min

- name: Fail this operation when the host platform is unsupported
  ansible.builtin.fail:
    msg: >-
      The claude role cannot run {{ claudeOperations }} on
      {{ ansible_facts.os_family }} / {{ ansible_facts.architecture }}
      ({{ inventory_hostname }}).
      Supported combinations: {{ claudeSupportMatrix }}.
  when: >-
    ansible_facts.os_family not in claudeSupportMatrix
    or ansible_facts.architecture
    not in claudeSupportMatrix[ansible_facts.os_family]

- name: Run the explicitly requested Claude operations
  ansible.builtin.include_tasks: "{{ claudeOperation }}.yml"
  loop: "{{ claudeOperations }}"
  loop_control:
    loop_var: claudeOperation
