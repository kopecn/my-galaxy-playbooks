---
- name: Read the installed LM Studio cask version
  ansible.builtin.command: brew list --cask --versions lm-studio
  become: false
  vars:
    ansible_become: false
  check_mode: false
  changed_when: false
  failed_when: false
  register: lmStudioCaskVersion

- name: Print the LM Studio installation status
  ansible.builtin.debug:
    msg: |-
      $ brew list --cask --versions lm-studio
      exit code: {{ lmStudioCaskVersion.rc | default('unknown') }}
      stdout:
      {{ lmStudioCaskVersion.stdout | default('(not installed)', true) | indent(2, true) }}
      stderr:
      {{ lmStudioCaskVersion.stderr | default(lmStudioCaskVersion.msg | default('(no output)'), true) | indent(2, true) }}
