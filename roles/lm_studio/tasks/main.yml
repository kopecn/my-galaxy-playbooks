---
- name: Validate the requested LM Studio operations
  ansible.builtin.assert:
    that:
      - lmStudioOperations is sequence
      - lmStudioOperations is not string
      - lmStudioOperations | length > 0
      - >-
        lmStudioOperations
        | difference(lmStudioSupportedOperations)
        | length == 0
    fail_msg: >-
      Declare lmStudioOperations as a non-empty list containing only
      {{ lmStudioSupportedOperations }}.
    quiet: true

- name: Gather target platform facts after resolving the SSH route
  ansible.builtin.setup:
    gather_subset:
      - min

- name: Fail this operation when the host platform is unsupported
  ansible.builtin.fail:
    msg: >-
      The lm_studio role cannot run {{ lmStudioOperations }} on
      {{ ansible_facts.os_family }} / {{ ansible_facts.architecture }}
      ({{ inventory_hostname }}).
      Supported combinations: {{ lmStudioSupportMatrix }}.
  when: >-
    ansible_facts.os_family not in lmStudioSupportMatrix
    or ansible_facts.architecture
    not in lmStudioSupportMatrix[ansible_facts.os_family]

- name: Run the explicitly requested LM Studio operations
  ansible.builtin.include_tasks: "{{ lmStudioOperation }}.yml"
  loop: "{{ lmStudioOperations }}"
  loop_control:
    loop_var: lmStudioOperation
