---
# Installs any vscodeExtensions entry not already present; skips the rest,
# so re-runs stay idempotent.
- name: List currently installed VS Code extensions
  ansible.builtin.command: code --list-extensions
  changed_when: false
  become: false
  register: vscodeInstalledExtensions

- name: Install missing VS Code extensions
  ansible.builtin.command: "code --install-extension {{ item }}"
  loop: "{{ vscodeExtensions }}"
  become: false
  changed_when: true
  when: (item | lower) not in (vscodeInstalledExtensions.stdout_lines | map('lower') | list)
