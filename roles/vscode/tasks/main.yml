---
# Cross-platform VS Code install, dispatched on the host's OS family and
# architecture. See .claude/specs/architecture/playbook-layering.md.

- name: Validate the requested VS Code operations
  ansible.builtin.assert:
    that:
      - vscodeOperations is sequence
      - vscodeOperations is not string
      - vscodeOperations | length > 0
      - >-
        vscodeOperations
        | difference(vscodeSupportedOperations)
        | length == 0
    fail_msg: >-
      Declare vscodeOperations as a non-empty list containing only
      {{ vscodeSupportedOperations }}.
    quiet: true

- name: Gather the target platform facts after resolving the SSH route
  ansible.builtin.setup:
    gather_subset:
      - min

- name: Fail this operation when the host OS family and architecture are unsupported
  ansible.builtin.fail:
    msg: >-
      The vscode role cannot run {{ vscodeOperations }} on
      {{ ansible_facts.os_family }} / {{ ansible_facts.architecture }}
      ({{ inventory_hostname }}).
      Supported combinations: {{ vscodeSupportMatrix }}.
  when: >-
    ansible_facts.os_family not in vscodeSupportMatrix
    or ansible_facts.architecture
    not in vscodeSupportMatrix[ansible_facts.os_family]

- name: Run the explicitly requested VS Code operations
  ansible.builtin.include_tasks: "{{ vscodeOperation }}.yml"
  loop: "{{ vscodeOperations }}"
  loop_control:
    loop_var: vscodeOperation
