---
# Role constants — not meant to be overridden by inventory.
vscodeSupportedOperations:
  - install

# Supported (OS family × canonical architecture) matrix for this role.
# Values match ansible_facts.os_family and ansible_facts.architecture exactly.
vscodeSupportMatrix:
  Darwin:
    - x86_64
    - arm64
  Debian:
    - x86_64
    - aarch64
    - armv7l
