---
- name: Validate the requested 1Password secrets
  ansible.builtin.assert:
    that:
      - op_queries is mapping
      - op_queries | length > 0
    fail_msg: >-
      Include the onepassword role with a populated op_queries map.

- name: Confirm the 1Password service-account token exists on the controller
  ansible.builtin.stat:
    path: "{{ op_token_file }}"
  delegate_to: localhost
  become: false
  vars:
    ansible_become: false
  check_mode: false
  changed_when: false
  register: opTokenFileStat

- name: Fail clearly when the service-account token is missing or empty
  ansible.builtin.assert:
    that:
      - opTokenFileStat.stat.exists
      - (opTokenFileStat.stat.size | default(0)) > 0
    fail_msg: >-
      No usable 1Password service-account token at {{ op_token_file }} on the
      controller. Write the service-account token to that file before running.

- name: Ensure the 1Password CLI is available on the controller
  ansible.builtin.command: op --version
  delegate_to: localhost
  become: false
  vars:
    ansible_become: false
  check_mode: false
  changed_when: false

- name: Read each requested 1Password query on the controller
  ansible.builtin.command:
    argv:
      - op
      - read
      - "{{ item.value }}"
  delegate_to: localhost
  become: false
  vars:
    ansible_become: false
  environment:
    OP_SERVICE_ACCOUNT_TOKEN: >-
      {{ lookup('ansible.builtin.file', op_token_file) | trim }}
  loop: "{{ op_queries | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  register: opQueryResults
  changed_when: false
  check_mode: false
  no_log: true

- name: Populate facts from the requested 1Password queries
  ansible.builtin.set_fact:
    "{{ item.item.key }}": "{{ item.stdout | trim }}"
  loop: "{{ opQueryResults.results }}"
  loop_control:
    label: "{{ item.item.key }}"
  no_log: true
