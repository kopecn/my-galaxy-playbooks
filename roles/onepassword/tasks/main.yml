---
- name: Validate the 1Password prerequisites on the super agent
  ansible.builtin.assert:
    that:
      - onePasswordTasks is sequence
      - onePasswordTasks is not string
      - onePasswordTasks | length > 0
      - onePasswordTasks | difference(onePasswordChoices) | length == 0
      - opCliAvailable
      - opTokenUsable
    fail_msg: >-
      {{
        "The 1Password CLI is unavailable on the super agent."
        if not opCliAvailable
        else
        "No usable 1Password service-account token at "
        ~ op_token_file
        ~ " on the super agent. Write the service-account token to that file "
        ~ "before running."
      }}
    quiet: true
  vars:
    opCliAvailable: >-
      {{
        lookup(
          'ansible.builtin.pipe',
          'op --version 2>/dev/null',
          errors='ignore'
        ) | trim | length > 0
      }}
    opTokenUsable: >-
      {{
        op_token_file is ansible.builtin.file
        and (
          lookup(
            'ansible.builtin.file',
            op_token_file,
            errors='ignore'
          ) | default('', true) | trim | length > 0
        )
      }}

- name: Run the explicitly requested 1Password tasks
  ansible.builtin.include_tasks: "{{ onePasswordTask }}.yml"
  loop: "{{ onePasswordTasks }}"
  loop_control:
    loop_var: onePasswordTask
