---
# Tasks for the example role. Every task is named and idempotent.
- name: Ensure example marker file is present
  ansible.builtin.copy:
    content: "Managed by Ansible — env: {{ env | default('unknown') }}\n"
    dest: "{{ exampleMarkerPath }}"
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Reload example service
