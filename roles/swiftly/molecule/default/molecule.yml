---
# Default scenario for the `swiftly` role.
# Only the Ubuntu/download path is covered here — Docker cannot host macOS
# containers, so the Darwin/Homebrew path is verified manually (docs/testing.md).
# Shared settings (driver, verifier, dependency) come from
# .config/molecule/config.yml via MOLECULE_GLOBAL_CONFIG.

platforms:
  - name: swiftly-ubuntu-2204
    image: geerlingguy/docker-ubuntu2204-ansible:latest
    pre_build_image: true
    command: /usr/lib/systemd/systemd
    cgroupns_mode: host
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
