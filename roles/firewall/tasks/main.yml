---
# Reusable firewall utility. Opens (or removes) a service port on Linux via UFW.
# macOS has no port-based step here — its application firewall is managed
# manually — so a Darwin caller no-ops. Uses the facts already gathered by the
# calling installer role.
- name: Validate the firewall request
  ansible.builtin.assert:
    that:
      - firewallPort is defined
    fail_msg: >-
      The firewall role requires firewallPort.

- name: Apply the firewall rule on Debian-family Linux
  ansible.builtin.include_tasks: Debian.yml
  when: ansible_facts.os_family == 'Debian'
