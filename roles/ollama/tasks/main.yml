---
- name: Validate the requested Ollama operations
  ansible.builtin.assert:
    that:
      - ollamaOperations is sequence
      - ollamaOperations is not string
      - ollamaOperations | length > 0
      - ollamaOperations | difference(ollamaSupportedOperations) | length == 0
    fail_msg: >-
      Declare ollamaOperations as a non-empty list containing only
      {{ ollamaSupportedOperations }}.
    quiet: true

- name: Gather the target platform facts after resolving the SSH route
  ansible.builtin.setup:
    gather_subset:
      - min

- name: Fail this operation when the host platform is unsupported
  ansible.builtin.fail:
    msg: >-
      The ollama role cannot run {{ ollamaOperations }} on
      {{ ansible_facts.os_family }} / {{ ansible_facts.architecture }}
      ({{ inventory_hostname }}).
      Supported combinations: {{ ollamaSupportMatrix }}.
  when: >-
    ansible_facts.os_family not in ollamaSupportMatrix
    or ansible_facts.architecture
    not in ollamaSupportMatrix[ansible_facts.os_family]

- name: Run the explicitly requested Ollama operations
  ansible.builtin.include_tasks: "{{ ollamaOperation }}.yml"
  loop: "{{ ollamaOperations }}"
  loop_control:
    loop_var: ollamaOperation
