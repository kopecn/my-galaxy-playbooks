---
- name: Read the Ollama version
  ansible.builtin.command: ollama --version
  become: false
  vars:
    ansible_become: false
  check_mode: false
  changed_when: false
  failed_when: false
  register: ollamaVersionOutput

- name: Print the Ollama version
  ansible.builtin.debug:
    msg: |-
      $ ollama --version
      exit code: {{ ollamaVersionOutput.rc | default('unknown') }}
      stdout:
      {{ ollamaVersionOutput.stdout | default('(no output)', true) | indent(2, true) }}
      stderr:
      {{ ollamaVersionOutput.stderr | default(ollamaVersionOutput.msg | default('(no output)'), true) | indent(2, true) }}

- name: List the locally available models
  ansible.builtin.command: ollama list
  become: false
  vars:
    ansible_become: false
  check_mode: false
  changed_when: false
  failed_when: false
  register: ollamaListOutput

- name: Print the locally available models
  ansible.builtin.debug:
    msg: |-
      $ ollama list
      exit code: {{ ollamaListOutput.rc | default('unknown') }}
      stdout:
      {{ ollamaListOutput.stdout | default('(no output)', true) | indent(2, true) }}
      stderr:
      {{ ollamaListOutput.stderr | default(ollamaListOutput.msg | default('(no output)'), true) | indent(2, true) }}
