---
- name: Install Ollama on macOS
  ansible.builtin.include_tasks: install-Darwin.yml
  when: ansible_facts.os_family == 'Darwin'

- name: Install Ollama on Debian-family Linux
  ansible.builtin.include_tasks: install-Debian.yml
  when: ansible_facts.os_family == 'Debian'

- name: Open the Ollama API port in the firewall
  ansible.builtin.include_role:
    name: firewall
  vars:
    firewallPort: "{{ ollamaPort }}"
    firewallComment: "Ollama API"
