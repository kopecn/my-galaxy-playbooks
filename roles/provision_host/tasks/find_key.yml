---
- name: Prepare controller authentication for 1Password
  ansible.builtin.include_tasks: controller_auth.yml

- name: List SSH key items in the target 1Password vault
  ansible.builtin.command:
    argv:
      - op
      - item
      - list
      - --categories=SSH Key
      - "--vault={{ provisionHostSshVaultId }}"
      - --format=json
  delegate_to: localhost
  become: false
  vars:
    ansible_become: false
  environment:
    OP_SERVICE_ACCOUNT_TOKEN: "{{ provisionHostSshOpToken }}"
  changed_when: false
  no_log: true
  register: provisionHostSshItemListResult

- name: Select the exact host SSH key item
  ansible.builtin.set_fact:
    provisionHostSshMatchingItems: >-
      {{ (provisionHostSshItemListResult.stdout | from_json)
         | selectattr('title', 'equalto', provisionHostSshItemName)
         | list }}
  no_log: true

- name: Reject ambiguous duplicate SSH key items
  ansible.builtin.assert:
    that:
      - provisionHostSshMatchingItems | length <= 1
    fail_msg: >-
      More than one SSH Key item named {{ provisionHostSshItemName }} exists in
      vault {{ onePasswordVault }}. Keep exactly one before retrying.

- name: Remember the existing host SSH key item ID
  ansible.builtin.set_fact:
    provisionHostSshItemId: "{{ provisionHostSshMatchingItems[0].id }}"
  no_log: true
  when: provisionHostSshMatchingItems | length == 1
