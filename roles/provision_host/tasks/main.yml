---
- name: Validate the requested SSH provisioning operation
  ansible.builtin.assert:
    that:
      - provisionHostSshOperation is defined
      - provisionHostSshOperation in provisionHostSshSupportedOperations
    fail_msg: >-
      provisionHostSshOperation must be one of
      {{ provisionHostSshSupportedOperations }}.

- name: Validate the SSH provisioning inputs
  ansible.builtin.assert:
    that:
      - provisionHostSshUser | length > 0
      - provisionHostSshUser != 'root'
      - provisionHostSshHost | length > 0
      - provisionHostSshPort | int > 0
      - provisionHostSshPort | int <= 65535
      - provisionHostSshItemName | length > 0
      - provisionHostSshStrictHostKeyChecking in ['yes', 'accept-new']
      - provisionHostSshValidationTimeout | int > 0
      - provisionHostSshValidationExtraArgs is sequence
      - provisionHostSshValidationExtraArgs is not string
    fail_msg: >-
      Set a non-root provisionHostSshUser, a valid host and port, a non-empty
      item name, and valid connection options.

- name: Normalize the gathered architecture to its canonical name
  ansible.builtin.set_fact:
    provisionHostSshArch: "{{ 'aarch64' if ansible_facts.architecture == 'arm64' else ansible_facts.architecture }}"

- name: Validate declared hostOperatingSystem against gathered facts
  ansible.builtin.assert:
    that:
      - hostOperatingSystem == ansible_facts.os_family
    fail_msg: >-
      Declared hostOperatingSystem ({{ hostOperatingSystem }}) does not match
      gathered os_family ({{ ansible_facts.os_family }}) on
      {{ inventory_hostname }}.
  when: hostOperatingSystem is defined

- name: Validate declared hostArchitecture against gathered facts
  ansible.builtin.assert:
    that:
      - hostArchitecture == provisionHostSshArch
    fail_msg: >-
      Declared hostArchitecture ({{ hostArchitecture }}) does not match
      gathered architecture ({{ provisionHostSshArch }}) on
      {{ inventory_hostname }}.
  when: hostArchitecture is defined

- name: Resolve the effective platform for dispatch
  ansible.builtin.set_fact:
    provisionHostSshOsFamily: "{{ hostOperatingSystem | default(ansible_facts.os_family) }}"
    provisionHostSshEffectiveArch: "{{ hostArchitecture | default(provisionHostSshArch) }}"

- name: Fail this operation when the host platform is unsupported
  ansible.builtin.fail:
    msg: >-
      The provision_host role cannot run {{ provisionHostSshOperation }} on
      {{ provisionHostSshOsFamily }} / {{ provisionHostSshEffectiveArch }}
      ({{ inventory_hostname }}). Supported combinations:
      {{ provisionHostSshSupportMatrix }}.
  when: >-
    provisionHostSshOsFamily not in provisionHostSshSupportMatrix
    or provisionHostSshEffectiveArch not in
       provisionHostSshSupportMatrix[provisionHostSshOsFamily]

- name: Explain SSH provisioning check-mode behavior
  ansible.builtin.debug:
    msg: >-
      SSH provisioning is skipped in check mode because creating a 1Password
      key and proving a new SSH authentication session cannot be simulated
      safely.
  when: ansible_check_mode

- name: Run the requested SSH provisioning operation
  ansible.builtin.include_tasks: "{{ provisionHostSshOperation }}.yml"
  when: not ansible_check_mode
