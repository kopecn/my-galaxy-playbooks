---
- name: Run the reusable host SSH key validator
  ansible.builtin.include_role:
    name: ssh
  vars:
    sshHost: "{{ provisionHostSshHost }}"
    sshPort: "{{ provisionHostSshPort }}"
    sshKeyItemName: "{{ provisionHostSshItemName }}"
    sshLoginItemName: >-
      user-{{ (hostName | default(inventory_hostname)).split('.')[0] }}
    sshValidationOpTokenFile: "{{ provisionHostSshOpTokenFile }}"
    sshStrictHostKeyChecking: "{{ provisionHostSshStrictHostKeyChecking }}"
    sshValidationTimeout: "{{ provisionHostSshValidationTimeout }}"
    sshValidationExtraArgs: "{{ provisionHostSshValidationExtraArgs }}"
