---
- name: Find any existing host SSH key in 1Password
  ansible.builtin.include_tasks: find_key.yml

- name: Create the host SSH key directly in 1Password
  ansible.builtin.command:
    argv:
      - op
      - item
      - create
      - --category=SSH Key
      - "--ssh-generate-key={{ provisionHostSshKeyType }}"
      - "--title={{ provisionHostSshItemName }}"
      - "--vault={{ provisionHostSshVaultId }}"
      - --format=json
  delegate_to: localhost
  become: false
  vars:
    ansible_become: false
  environment:
    OP_SERVICE_ACCOUNT_TOKEN: "{{ provisionHostSshOpToken }}"
  changed_when: true
  no_log: true
  register: provisionHostSshCreatedItem
  when: provisionHostSshMatchingItems | length == 0

- name: Remember the newly created host SSH key item ID
  ansible.builtin.set_fact:
    provisionHostSshItemId: "{{ (provisionHostSshCreatedItem.stdout | from_json).id }}"
  no_log: true
  when: provisionHostSshMatchingItems | length == 0

- name: Read the host SSH key item metadata
  ansible.builtin.command:
    argv:
      - op
      - item
      - get
      - "{{ provisionHostSshItemId }}"
      - "--vault={{ provisionHostSshVaultId }}"
      - --format=json
  delegate_to: localhost
  become: false
  vars:
    ansible_become: false
  environment:
    OP_SERVICE_ACCOUNT_TOKEN: "{{ provisionHostSshOpToken }}"
  changed_when: false
  no_log: true
  register: provisionHostSshItemResult
  when: provisionHostSshAddBookmark | bool

- name: Determine whether the 1Password SSH bookmark is current
  ansible.builtin.set_fact:
    provisionHostSshBookmarkUrl: >-
      {{
        'ssh://' ~ provisionHostSshUser ~ '@'
        ~ (
          '[' ~ provisionHostSshHost ~ ']'
          if ':' in provisionHostSshHost and not provisionHostSshHost.startswith('[')
          else provisionHostSshHost
        )
        ~ ':' ~ (provisionHostSshPort | int | string)
      }}
    provisionHostSshExistingBookmarkUrls: >-
      {{ ((provisionHostSshItemResult.stdout | from_json).fields | default([]))
         | selectattr('type', 'equalto', 'URL')
         | map(attribute='value')
         | list }}
  no_log: true
  when: provisionHostSshAddBookmark | bool

- name: Add or update the 1Password SSH bookmark
  ansible.builtin.command:
    argv:
      - op
      - item
      - edit
      - "{{ provisionHostSshItemId }}"
      - "--vault={{ provisionHostSshVaultId }}"
      - "host[url]={{ provisionHostSshBookmarkUrl }}"
  delegate_to: localhost
  become: false
  vars:
    ansible_become: false
  environment:
    OP_SERVICE_ACCOUNT_TOKEN: "{{ provisionHostSshOpToken }}"
  changed_when: true
  no_log: true
  when:
    - provisionHostSshAddBookmark | bool
    - provisionHostSshBookmarkUrl not in provisionHostSshExistingBookmarkUrls
