---
- name: Resolve the SSH username, password, and private key from 1Password
  ansible.builtin.include_role:
    name: onepassword
  vars:
    op_token_file: "{{ onePasswordTokenFile }}"
    op_queries: "{{ onePasswordSshUserPassQueries }}"

- name: Apply the SSH password for privilege escalation
  ansible.builtin.set_fact:
    ansible_become_password: "{{ ansible_password }}"
  no_log: true
