---
- name: Validate the requested SSH operations
  ansible.builtin.assert:
    that:
      - sshOperations is sequence
      - sshOperations is not string
      - sshOperations | length > 0
      - sshOperations | difference(sshOperationChoices) | length == 0
    fail_msg: >-
      sshOperations must be a non-empty list containing only valid operations:
      {{ sshOperationChoices | join(', ') }}.

- name: Run the explicitly requested SSH operations
  ansible.builtin.include_tasks: "{{ sshOperation }}.yml"
  loop: "{{ sshOperations }}"
  loop_control:
    loop_var: sshOperation
