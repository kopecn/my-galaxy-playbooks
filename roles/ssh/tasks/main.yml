---
- name: Resolve the SSH route
  ansible.builtin.set_fact:
    sshResolvedHost: >-
      {%- if useVpn | bool -%} {{ vpnHostname }}.{{ vpnDomain }}{%- elif ',' in inventory_file -%} {{ inventory_hostname }}{%- else -%} {{ hostName }}.local{%- endif
      -%}

- name: Apply the resolved ephemeral SSH route
  ansible.builtin.set_fact:
    ansible_host: "{{ sshResolvedHost }}"
    ansible_ssh_common_args: >-
      -F /dev/null
      -o UserKnownHostsFile=/dev/null
      -o GlobalKnownHostsFile=/dev/null
      -o StrictHostKeyChecking=no
      -o ControlMaster=no
      -o ControlPath=none

- name: Report the resolved SSH route
  ansible.builtin.debug:
    msg: "SSH route: {{ inventory_hostname }} -> {{ sshResolvedHost }}"
