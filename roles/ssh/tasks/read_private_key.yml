---
- name: Read the host private key from 1Password in OpenSSH format
  ansible.builtin.command:
    argv:
      - op
      - read
      - "op://{{ sshVaultId }}/{{ sshKeyItemId }}/private key?ssh-format=openssh"
  delegate_to: localhost
  become: false
  vars:
    ansible_become: false
  environment:
    OP_SERVICE_ACCOUNT_TOKEN: "{{ sshOpToken }}"
  check_mode: false
  changed_when: false
  failed_when: false
  no_log: true
  register: sshPrivateKeyResult

- name: Require the private key to be readable from 1Password
  ansible.builtin.assert:
    that:
      - sshPrivateKeyResult.rc == 0
      - sshPrivateKeyResult.stdout | trim | length > 0
    fail_msg: >-
      1Password item {{ sshResolvedKeyItemName }} exists, but its private key
      could not be read in OpenSSH format. State: validationError.
  no_log: true

- name: Remember the host private key in memory
  ansible.builtin.set_fact:
    sshResolvedPrivateKey: "{{ sshPrivateKeyResult.stdout | trim }}"
  no_log: true
