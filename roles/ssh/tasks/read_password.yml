---
- name: Read the host password from 1Password
  ansible.builtin.command:
    argv:
      - op
      - read
      - "op://{{ sshVaultId }}/{{ sshLoginItemId }}/password"
  delegate_to: localhost
  become: false
  vars:
    ansible_become: false
  environment:
    OP_SERVICE_ACCOUNT_TOKEN: "{{ sshOpToken }}"
  check_mode: false
  changed_when: false
  failed_when: false
  no_log: true
  register: sshPasswordResult

- name: Require a non-empty password in the host Login item
  ansible.builtin.assert:
    that:
      - sshPasswordResult.rc == 0
      - sshPasswordResult.stdout | trim | length > 0
    fail_msg: >-
      Login item {{ sshResolvedLoginItemName }} must contain a non-empty
      password field for this connection. State: validationError.
  no_log: true

- name: Remember the host password in memory
  ansible.builtin.set_fact:
    sshResolvedPassword: "{{ sshPasswordResult.stdout | trim }}"
  no_log: true
