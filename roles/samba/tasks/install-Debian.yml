---
- name: Validate the Samba account configuration
  ansible.builtin.assert:
    that:
      - sambaUsername is defined
      - sambaUsername | length > 0
    fail_msg: >-
      sambaUsername must resolve to the SMB/Unix account name to provision on
      {{ inventory_hostname }} — set it directly (per-host, normally from the
      downstream inventory) or via the username field of sambaPasswordOpItem in
      1Password.

- name: Install the Samba packages
  ansible.builtin.apt:
    name:
      - samba
      - samba-common-bin
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: Enforce required SMB transport encryption for all shares
  community.general.ini_file:
    path: /etc/samba/smb.conf
    section: global
    option: smb encrypt
    value: required
    no_extra_spaces: true
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Restart Samba

- name: Make the per-user home share writable
  # The stock Debian smb.conf ships [homes] as read only = yes, so users can
  # connect and browse but cannot create files. Turn the built-in per-user home
  # share writable in place; %S resolves to the connecting user's own home.
  community.general.ini_file:
    path: /etc/samba/smb.conf
    section: homes
    option: "{{ item.option }}"
    value: "{{ item.value }}"
    no_extra_spaces: true
    owner: root
    group: root
    mode: "0644"
  become: true
  loop:
    - { option: "read only", value: "no" }
    - { option: "valid users", value: "%S" }
    - { option: "create mask", value: "0644" }
    - { option: "directory mask", value: "0755" }
    - { option: "browseable", value: "no" }
  loop_control:
    label: "{{ item.option }}"
  notify: Restart Samba

- name: Ensure the Samba services are enabled and running
  ansible.builtin.service:
    name: "{{ item }}"
    enabled: true
    state: started
  become: true
  loop:
    - smbd
    - nmbd

- name: Gather installed package facts
  ansible.builtin.package_facts:
    manager: apt

- name: Allow SMB through UFW when UFW is present
  community.general.ufw:
    rule: allow
    port: "445"
    proto: tcp
    comment: "Samba SMB"
  become: true
  when: "'ufw' in ansible_facts.packages"

- name: Ensure the Unix account backing the Samba user exists
  ansible.builtin.user:
    name: "{{ sambaUsername }}"
    state: present
  become: true

- name: Check whether the Samba user already exists in the passdb
  ansible.builtin.command: "pdbedit --list --user={{ sambaUsername }}"
  become: true
  check_mode: false
  changed_when: false
  failed_when: false
  register: sambaPassdbEntry

- name: Resolve and set the Samba password when the user is absent
  when:
    - sambaPassdbEntry.rc != 0
    - not ansible_check_mode
  block:
    - name: Use the directly supplied Samba password when present
      ansible.builtin.set_fact:
        sambaEffectivePassword: "{{ sambaPassword }}"
      no_log: true
      when: sambaPassword is defined and (sambaPassword | length > 0)

    - name: Validate the Samba password is available
      ansible.builtin.assert:
        that:
          - sambaEffectivePassword is defined
          - sambaEffectivePassword | length > 0
        fail_msg: >-
          Declare the samba workflow in onePasswordTasks or provide
          sambaPassword directly.
      no_log: true

    - name: Create the Samba user with the resolved password
      ansible.builtin.command:
        argv:
          - smbpasswd
          - -s
          - -a
          - "{{ sambaUsername }}"
        stdin: "{{ sambaEffectivePassword }}\n{{ sambaEffectivePassword }}\n"
      become: true
      changed_when: true
      no_log: true
