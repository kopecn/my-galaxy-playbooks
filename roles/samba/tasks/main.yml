---
- name: Validate the requested Samba operations
  ansible.builtin.assert:
    that:
      - sambaOperations is sequence
      - sambaOperations is not string
      - sambaOperations | length > 0
      - sambaOperations | difference(sambaSupportedOperations) | length == 0
    fail_msg: >-
      Declare sambaOperations as a non-empty list containing only
      {{ sambaSupportedOperations }}.
    quiet: true

- name: Gather the target platform facts after resolving the SSH route
  ansible.builtin.setup:
    gather_subset:
      - min

- name: Fail this operation when the host platform is unsupported
  ansible.builtin.fail:
    msg: >-
      The samba role cannot run {{ sambaOperations }} on
      {{ ansible_facts.os_family }} / {{ ansible_facts.architecture }}
      ({{ inventory_hostname }}).
      Supported combinations: {{ sambaSupportMatrix }}.
  when: >-
    ansible_facts.os_family not in sambaSupportMatrix
    or ansible_facts.architecture
    not in sambaSupportMatrix[ansible_facts.os_family]

- name: Run the explicitly requested Samba operations
  ansible.builtin.include_tasks: "{{ sambaOperation }}.yml"
  loop: "{{ sambaOperations }}"
  loop_control:
    loop_var: sambaOperation
