---
galaxy_info:
  role_name: ssh_provisioning
  author: nbergantz
  description: >-
    Bind the command-line provisioning_username and provisioning_password to the
    SSH connection, generate an ed25519 keypair in a temporary directory, push
    the public key to the host's authorized_keys, and move the keypair into the
    control node's ~/.ssh (provisioning gate 2).
  license: MIT
  min_ansible_version: "2.16"
  platforms:
    - name: MacOSX
    - name: Ubuntu
      versions:
        - jammy
        - noble
    - name: EL
      versions:
        - "9"
  galaxy_tags:
    - ssh
    - provisioning
dependencies: []
