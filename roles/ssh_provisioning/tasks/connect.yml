---
# Gate 1 (connect): connect over SSH with the run-time username and password and
# prove the host accepts them. Credentials come from the command line
# (-e sshProvisioningUsername=... -e sshProvisioningPassword=...), not 1Password.

- name: Require the provisioning username and password
  ansible.builtin.assert:
    that:
      - sshProvisioningUsername is defined
      - sshProvisioningUsername | length > 0
      - sshProvisioningPassword is defined
      - sshProvisioningPassword | length > 0
    fail_msg: >-
      Pass -e sshProvisioningUsername=... and -e sshProvisioningPassword=... on the
      command line.
  no_log: true

- name: Bind the provisioning credentials to the SSH connection
  ansible.builtin.set_fact:
    ansible_user: "{{ sshProvisioningUsername }}"
    ansible_password: "{{ sshProvisioningPassword }}"
    ansible_become_password: "{{ sshProvisioningPassword }}"
  no_log: true

- name: Attempt SSH with the provisioning credentials
  ansible.builtin.ping:
  register: sshProvisioningCredentialCheck
  failed_when: false
  ignore_unreachable: true
  no_log: true

- name: Fail clearly when the provisioning credentials are rejected
  ansible.builtin.fail:
    msg: >-
      SSH authentication was rejected for provisioning user
      '{{ sshProvisioningUsername }}' on '{{ ansible_host | default(inventory_hostname) }}'.
      Verify the supplied sshProvisioningUsername and sshProvisioningPassword.
      The password value remains redacted.
  when:
    - sshProvisioningCredentialCheck.ping | default('') != 'pong'
    - >-
      'permission denied' in
      (sshProvisioningCredentialCheck.msg | default('') | lower)
      or 'authentication failed' in
      (sshProvisioningCredentialCheck.msg | default('') | lower)

- name: Fail clearly when the provisioning SSH connection cannot be established
  ansible.builtin.fail:
    msg: >-
      Could not establish SSH to provisioning user '{{ sshProvisioningUsername }}'
      on '{{ ansible_host | default(inventory_hostname) }}'; the supplied credentials
      were not validated. Verify hostname resolution, network reachability, and the
      SSH service. Credential values remain redacted.
  when: sshProvisioningCredentialCheck.ping | default('') != 'pong'

- name: Mark the provisioning connection as validated
  ansible.builtin.set_fact:
    sshProvisioningConnectionValidated: true
