---
# Gate 3 (lock down): prove key-only authentication immediately before changing
# sshd, then disable password and keyboard-interactive authentication. The
# ordered operation dispatcher requires the validate gate to pass first. If the
# new configuration is invalid or cannot be reloaded, restore the prior state.

- name: Require validated key-only SSH before disabling password access
  ansible.builtin.assert:
    that:
      - sshProvisioningKeyValidated | bool
    fail_msg: >-
      Run validate before disable_password in sshProvisioningOperations.

- name: Bind the optional privilege-escalation password
  ansible.builtin.set_fact:
    ansible_become_password: "{{ sshProvisioningPassword }}"
  no_log: true
  when:
    - sshProvisioningPassword is defined
    - sshProvisioningPassword | length > 0

- name: Inspect the SSH daemon configuration
  ansible.builtin.stat:
    path: /etc/ssh/sshd_config
  become: true
  register: sshDaemonConfig

- name: Preserve the SSH daemon configuration
  ansible.builtin.slurp:
    path: /etc/ssh/sshd_config
  become: true
  register: sshDaemonConfigBackup

- name: Discover the SSH daemon service
  ansible.builtin.service_facts:
  become: true

- name: Select the SSH daemon service
  ansible.builtin.set_fact:
    sshProvisioningServiceName: >-
      {{ 'sshd' if 'sshd.service' in ansible_facts.services
         else 'ssh' if 'ssh.service' in ansible_facts.services
         else '' }}

- name: Require a supported SSH daemon service
  ansible.builtin.assert:
    that:
      - sshProvisioningServiceName | length > 0
    fail_msg: >-
      Could not find ssh.service or sshd.service; password access was not
      changed.

- name: Disable SSH password authentication safely
  block:
    - name: Install the SSH password lock-down block first
      ansible.builtin.blockinfile:
        path: /etc/ssh/sshd_config
        insertbefore: BOF
        marker: "# {mark} SSH provisioning password lock-down"
        block: |
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          ChallengeResponseAuthentication no
        validate: /usr/sbin/sshd -t -f %s
      become: true

    - name: Validate the complete SSH daemon configuration
      ansible.builtin.command:
        argv:
          - /usr/sbin/sshd
          - -t
      become: true
      changed_when: false

    - name: Reload the SSH daemon
      ansible.builtin.service:
        name: "{{ sshProvisioningServiceName }}"
        state: reloaded
      become: true

    - name: Read the effective SSH daemon configuration
      ansible.builtin.command:
        argv:
          - /usr/sbin/sshd
          - -T
      become: true
      changed_when: false
      register: sshProvisioningEffectiveConfig

    - name: Verify that SSH password access is disabled
      ansible.builtin.assert:
        that:
          - "'passwordauthentication no' in sshProvisioningEffectiveConfig.stdout_lines"
          - "'kbdinteractiveauthentication no' in sshProvisioningEffectiveConfig.stdout_lines"
        fail_msg: >-
          The effective SSH daemon configuration still permits password access:
          {{ sshProvisioningEffectiveConfig.stdout_lines
             | select('match', '^(password|kbdinteractive)authentication ')
             | list }}

  rescue:
    - name: Restore the previous SSH daemon configuration
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config
        owner: "{{ sshDaemonConfig.stat.pw_name | default('root') }}"
        group: "{{ sshDaemonConfig.stat.gr_name | default('root') }}"
        mode: "{{ sshDaemonConfig.stat.mode | default('0600') }}"
        content: "{{ sshDaemonConfigBackup.content | b64decode }}"
      become: true

    - name: Validate the restored SSH daemon configuration
      ansible.builtin.command:
        argv:
          - /usr/sbin/sshd
          - -t
      become: true
      changed_when: false

    - name: Reload the restored SSH daemon configuration
      ansible.builtin.service:
        name: "{{ sshProvisioningServiceName }}"
        state: reloaded
      become: true

    - name: Report the SSH password lock-down failure
      ansible.builtin.fail:
        msg: >-
          Disabling SSH password access failed. The previous SSH daemon
          configuration was restored and reloaded.
