---
# Gate 2 (install key): reuse an existing local key by default, or generate an
# ed25519 keypair in a temp dir when no key exists (or sshKeyOverwrite is true).
# Push the selected public key to the host's authorized_keys. Runs the connect
# gate first to bind credentials and prove the host is reachable. (Storing the
# key in 1Password is not yet wired in.)

- name: Run the connect gate before installing the key
  ansible.builtin.include_tasks: connect.yml

- name: Ensure the local ~/.ssh directory exists
  ansible.builtin.file:
    path: "{{ lookup('env', 'HOME') }}/.ssh"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false
  vars:
    ansible_become: false

- name: Check whether the local private key already exists
  ansible.builtin.stat:
    path: "{{ lookup('env', 'HOME') }}/.ssh/{{ sshFileName }}"
  delegate_to: localhost
  become: false
  vars:
    ansible_become: false
  register: sshExistingKey

- name: Read the public key from the existing private key
  ansible.builtin.command:
    argv:
      - ssh-keygen
      - -y
      - -f
      - "{{ lookup('env', 'HOME') }}/.ssh/{{ sshFileName }}"
  delegate_to: localhost
  become: false
  vars:
    ansible_become: false
  changed_when: false
  register: sshExistingPublicKey
  when:
    - sshExistingKey.stat.exists
    - not (sshKeyOverwrite | bool)

- name: Reuse the existing public key in the host's authorized_keys
  ansible.posix.authorized_key:
    user: "{{ provisioning_username }}"
    state: present
    key: "{{ sshExistingPublicKey.stdout }}"
  when:
    - sshExistingKey.stat.exists
    - not (sshKeyOverwrite | bool)

- name: Create a temporary directory for the generated keypair
  ansible.builtin.tempfile:
    state: directory
    suffix: ssh-provisioning
  delegate_to: localhost
  become: false
  vars:
    ansible_become: false
  register: sshKeyTmp
  when: (sshKeyOverwrite | bool) or not sshExistingKey.stat.exists

- name: Generate the SSH keypair in the temporary directory
  ansible.builtin.command:
    argv:
      - ssh-keygen
      - -t
      - ed25519
      - -N
      - ""
      - -C
      - "{{ sshFileName }}"
      - -f
      - "{{ sshKeyTmp.path }}/{{ sshFileName }}"
  delegate_to: localhost
  become: false
  vars:
    ansible_become: false
  changed_when: true
  when: (sshKeyOverwrite | bool) or not sshExistingKey.stat.exists

- name: Push the generated public key to the host's authorized_keys
  ansible.posix.authorized_key:
    user: "{{ provisioning_username }}"
    state: present
    key: "{{ lookup('file', sshKeyTmp.path ~ '/' ~ sshFileName ~ '.pub') }}"
  when: (sshKeyOverwrite | bool) or not sshExistingKey.stat.exists

- name: Move the generated keypair into ~/.ssh
  ansible.builtin.copy:
    src: "{{ sshKeyTmp.path }}/{{ item.name }}"
    dest: "{{ lookup('env', 'HOME') }}/.ssh/{{ item.name }}"
    mode: "{{ item.mode }}"
    remote_src: true
    force: true
  loop:
    - { name: "{{ sshFileName }}", mode: "0600" }
    - { name: "{{ sshFileName }}.pub", mode: "0644" }
  delegate_to: localhost
  become: false
  vars:
    ansible_become: false
  when: (sshKeyOverwrite | bool) or not sshExistingKey.stat.exists

- name: Remove the temporary keypair directory
  ansible.builtin.file:
    path: "{{ sshKeyTmp.path }}"
    state: absent
  delegate_to: localhost
  become: false
  vars:
    ansible_become: false
  when: (sshKeyOverwrite | bool) or not sshExistingKey.stat.exists
