---
# Dispatch to the requested provisioning operation. Each gate lives in its own
# task file: connect.yml (gate 1), install.yml (gate 2), validate.yml (gate 3).

- name: Validate the requested SSH provisioning operation
  ansible.builtin.assert:
    that:
      - sshProvisioningOperation is defined
      - sshProvisioningOperation in sshProvisioningOperations
    fail_msg: >-
      sshProvisioningOperation must be one of
      {{ sshProvisioningOperations }}.

- name: Run the requested SSH provisioning operation
  ansible.builtin.include_tasks: "{{ sshProvisioningOperation }}.yml"
