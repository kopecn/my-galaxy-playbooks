---
# Gate 3 (validate): prove the key installed by install_key authenticates over
# a publickey-only SSH connection. The disable_password operation includes this
# task file as its mandatory safety gate before changing sshd.

- name: Require the provisioning username
  ansible.builtin.assert:
    that:
      - sshProvisioningUsername is defined
      - sshProvisioningUsername | length > 0
    fail_msg: >-
      Pass -e sshProvisioningUsername=... (the account whose key was installed).

- name: Locate the installed private key on the control node
  ansible.builtin.stat:
    path: "{{ lookup('env', 'HOME') }}/.ssh/{{ sshFileName }}"
  delegate_to: localhost
  become: false
  vars:
    ansible_become: false
  register: sshValidationKey

- name: Require the installed private key to exist
  ansible.builtin.assert:
    that:
      - sshValidationKey.stat.exists
    fail_msg: >-
      No private key at ~/.ssh/{{ sshFileName }}. Run the install_key operation
      first (with the same -e sshFileName=... if you overrode it).

- name: Bind the installed key to the SSH connection (publickey only)
  ansible.builtin.set_fact:
    ansible_user: "{{ sshProvisioningUsername }}"
    ansible_ssh_private_key_file: "{{ lookup('env', 'HOME') }}/.ssh/{{ sshFileName }}"
    ansible_ssh_extra_args: >-
      -o PreferredAuthentications=publickey
      -o IdentitiesOnly=yes
      -o PasswordAuthentication=no
      -o BatchMode=yes

- name: Validate that the installed key authenticates
  ansible.builtin.ping:

- name: Mark key-only SSH authentication as validated
  ansible.builtin.set_fact:
    sshProvisioningKeyValidated: true
