---
# Ordered operation workflows requested by the invoking playbook. There is no
# implicit provisioning operation because each workflow has different safety
# and credential requirements.
sshProvisioningOperations: []

# Basename for the generated/validated SSH keypair (private = <sshFileName>,
# public = <sshFileName>.pub). Lowest-precedence default; override at the
# playbook call with -e sshFileName=...
sshFileName: common-ssh-key

# Preserve an existing local private key with the same sshFileName by default.
# Set to true to generate a new keypair and replace the existing files.
sshKeyOverwrite: false
