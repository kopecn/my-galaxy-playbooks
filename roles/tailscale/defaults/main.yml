---
# Ordered operations requested by the invoking ansible-playbook command. There
# is no implicit operation; callers must explicitly choose at least one.
tailscaleOperations: []

# 1Password item name. The name must contain no comma: commas are invalid in an
# op:// secret reference. Semantic names keep programmatically created items
# human-readable and consistent.
tailscaleAuthKeyItem: "AuthKey-Tailscale Auth Key-Ansible Provisioning"
tailscaleSSH: false
