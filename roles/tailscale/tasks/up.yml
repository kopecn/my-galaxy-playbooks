---
- name: Ensure Tailscale is installed before connecting
  ansible.builtin.include_tasks: install.yml

- name: Query Tailscale connection status
  ansible.builtin.command: tailscale status --json
  become: true
  check_mode: false
  changed_when: false
  failed_when: false
  register: tailscaleStatus
  environment:
    TAILSCALE_BE_CLI: "1"

- name: Query whether Tailscale SSH is enabled
  ansible.builtin.command: tailscale get ssh
  become: true
  check_mode: false
  changed_when: false
  failed_when: false
  register: tailscaleSshSetting
  environment:
    TAILSCALE_BE_CLI: "1"

- name: Query whether Tailscale routes are accepted
  ansible.builtin.command: tailscale get accept-routes
  become: true
  check_mode: false
  changed_when: false
  failed_when: false
  register: tailscaleAcceptRoutesSetting
  environment:
    TAILSCALE_BE_CLI: "1"

- name: Determine whether Tailscale connection settings need convergence
  ansible.builtin.set_fact:
    tailscaleNeedsUp: >-
      {{ tailscaleStatus.rc != 0
         or tailscaleSshSetting.rc != 0
         or tailscaleAcceptRoutesSetting.rc != 0
         or (tailscaleStatus.stdout | from_json).BackendState != 'Running'
         or tailscaleSshSetting.stdout | trim != 'true'
         or tailscaleAcceptRoutesSetting.stdout | trim != 'true' }}

- name: Validate the controller's 1Password configuration
  ansible.builtin.assert:
    that:
      - onePasswordVault | length > 0
      - onePasswordTailscaleAPIKey | length > 0
    fail_msg: >-
      Set onePasswordVault and onePasswordTailscaleAPIKey in the repository's
      vars/defaults.yml file on the playbook controller.
  when:
    - tailscaleNeedsUp
    - not ansible_check_mode

- name: Ensure the 1Password CLI is available on the controller
  ansible.builtin.command: op --version
  delegate_to: localhost
  become: false
  vars:
    ansible_become: false
  check_mode: false
  changed_when: false
  when:
    - tailscaleNeedsUp
    - not ansible_check_mode

- name: Read the Tailscale auth key from 1Password
  ansible.builtin.command:
    argv:
      - "{{ role_path }}/../../scripts/with-op"
      - op
      - read
      - "op://{{ onePasswordVault }}/{{ onePasswordTailscaleAPIKey }}/credential"
      - --no-newline
  delegate_to: localhost
  become: false
  vars:
    ansible_become: false
  check_mode: false
  changed_when: false
  no_log: true
  register: tailscaleAuthKey
  when:
    - tailscaleNeedsUp
    - not ansible_check_mode

- name: Connect Tailscale with SSH and accepted routes
  ansible.builtin.command:
    argv:
      - tailscale
      - up
      - --auth-key=file:/dev/stdin
      - --reset
      - --accept-routes
      - --timeout=2m
    stdin: "{{ tailscaleAuthKey.stdout }}"
    stdin_add_newline: false
  become: true
  changed_when: true
  no_log: true
  environment:
    TAILSCALE_BE_CLI: "1"
  when:
    - tailscaleNeedsUp
    - not ansible_check_mode

- name: Verify Tailscale is connected
  ansible.builtin.command: tailscale status --json
  become: true
  check_mode: false
  changed_when: false
  register: tailscaleConnectedStatus
  environment:
    TAILSCALE_BE_CLI: "1"
  when: not ansible_check_mode

- name: Confirm the Tailscale backend is running
  ansible.builtin.assert:
    that:
      - (tailscaleConnectedStatus.stdout | from_json).BackendState == 'Running'
    fail_msg: "Tailscale did not reach the Running state."
  when: not ansible_check_mode
