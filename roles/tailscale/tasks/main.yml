---
- name: Validate the requested Tailscale operations
  ansible.builtin.assert:
    that:
      - tailscaleOperations is sequence
      - tailscaleOperations is not string
      - tailscaleOperations | length > 0
      - >-
        tailscaleOperations
        | difference(tailscaleSupportedOperations)
        | length == 0
    fail_msg: >-
      Declare tailscaleOperations as a non-empty list containing only
      {{ tailscaleSupportedOperations }}.
    quiet: true

- name: Gather the target platform facts after resolving the SSH route
  ansible.builtin.setup:
    gather_subset:
      - min

- name: Fail this operation when the host platform is unsupported
  ansible.builtin.fail:
    msg: >-
      The tailscale role cannot run {{ tailscaleOperations }} on
      {{ ansible_facts.os_family }} / {{ ansible_facts.architecture }}
      ({{ inventory_hostname }}).
      Supported combinations: {{ tailscaleSupportMatrix }}.
  when: >-
    ansible_facts.os_family not in tailscaleSupportMatrix
    or ansible_facts.architecture
    not in tailscaleSupportMatrix[ansible_facts.os_family]

- name: Run the explicitly requested Tailscale operations
  ansible.builtin.include_tasks: "{{ tailscaleOperation }}.yml"
  loop: "{{ tailscaleOperations }}"
  loop_control:
    loop_var: tailscaleOperation
