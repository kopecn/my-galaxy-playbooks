---
# https://yamllint.readthedocs.io/en/stable/configuration.html
extends: default

ignore: |
  .ansible/
  .cache/
  .mypy_cache/
  .pytest_cache/
  .venv/
  collections/
  env/
  galaxy_roles/
  tests/output/
  venv/

rules:
  line-length:
    max: 160
    level: warning
  truthy:
    allowed-values: ["true", "false"]
    check-keys: false
  comments:
    min-spaces-from-content: 1
  comments-indentation: false
  braces:
    max-spaces-inside: 1
  octal-values:
    forbid-implicit-octal: true
    forbid-explicit-octal: true
  document-start:
    present: true
